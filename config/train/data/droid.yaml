dataset:
  root: /datasets/droid_lerobot
  frames_root: /datasets/droid_lerobot/frames   # pre-extracted JPEGs; remove to fall back to MP4
  camera_keys:
    - exterior_image_1_left
    - exterior_image_2_left
    - wrist_image_left
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 5         # obs at 3Hz; action block = 5 actions concat → predict 333ms ahead
  clip_stride: 1       # JPEG random access is fast — use all clips
  max_episodes: null   # null = all 57K episodes; set to small int for smoke tests
  keys_to_load:
    - pixels_0
    - pixels_1
    - pixels_2
    - action
    - proprio
