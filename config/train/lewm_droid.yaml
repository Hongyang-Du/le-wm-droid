defaults:
  - _self_
  - data: droid

output_model_name: lewm_droid
subdir: ${hydra:job.id}

num_workers: 8
train_split: 0.99        # 1% val is plenty given 57K episodes
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: small     # ViT-S: hidden_size=384, more capacity for manipulation

trainer:
  max_epochs: 10
  devices: 8        # all 8 GPUs; SIGReg uses all_gather across ranks for correct global stats
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 32    # per-GPU; effective = 32×7 = 224 total
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 2
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: uscgvl
    project: lewm-droid
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 384           # match ViT-S hidden size (no linear projection needed)

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
